server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change — cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so deploys take effect.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Optional: serve the API's live sitemap/robots from the site's own origin.
    # Same-origin needs no setup and satisfies stricter crawlers; Google also
    # accepts a sitemap on the API host if both hosts are verified in Search
    # Console (then set SITEMAP_URL on the backend and drop these blocks).
    # ${API_UPSTREAM} is substituted at container start (see Dockerfile);
    # requests fall back to the static files in /public if the API is down.
    location = /sitemap.xml {
        proxy_pass ${API_UPSTREAM}/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @static;
    }

    location = /robots.txt {
        proxy_pass ${API_UPSTREAM}/api/robots.txt;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @static;
    }

    location @static {
        try_files $uri =404;
    }

    # SPA fallback — createBrowserRouter needs every deep link to serve
    # index.html or refreshes and direct links 404.
    location / {
        try_files $uri /index.html;
    }
}
